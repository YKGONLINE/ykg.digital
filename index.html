<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="YKG Destek — 7/24 AI e-ticaret müşteri destek + iade/sipariş asistanı. Widget, WhatsApp, Instagram, Trendyol & Hepsiburada Q&A. İletişim: ykg@ykg.digital" />
  <meta name="theme-color" content="#050505" />
  <meta name="facebook-domain-verification" content="fxlt9y253zdtoo53sxz4uhuq4bglka" />
  <meta property="og:title" content="YKG Destek — AI e-ticaret müşteri destek" />
  <meta property="og:description" content="7/24 AI müşteri destek + iade/sipariş asistanı. Site widget, WhatsApp, IG, Trendyol & Hepsiburada Q&A." />

  <title>YKG Destek — AI e-ticaret müşteri destek | YKG Digital</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #050505;
      --fg: #f2f2f2;
      --muted: #8a8a8a;
      --soft: #bdbdbd;
      --line: rgba(255, 255, 255, 0.1);
      --glow: rgba(255, 255, 255, 0.045);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 55% at 50% -10%, var(--glow), transparent 55%),
        radial-gradient(ellipse 45% 35% at 50% 110%, rgba(255,255,255,0.03), transparent 50%);
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: max(10px, env(safe-area-inset-top, 0px))
             max(10px, env(safe-area-inset-right, 0px))
             max(10px, env(safe-area-inset-bottom, 0px))
             max(10px, env(safe-area-inset-left, 0px));
      border: 1px solid var(--line);
      pointer-events: none;
      z-index: 2;
    }

    @media (min-width: 720px) {
      body::after { inset: 20px; }
    }

    .shell {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      min-height: 100dvh;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 1.25rem 0;
      max-width: 52rem;
      width: 100%;
      margin: 0 auto;
    }

    @media (min-width: 720px) {
      header { justify-content: space-between; padding: 1.75rem 1.5rem 0; }
    }

    .wordmark {
      height: 14px;
      width: auto;
      opacity: 0.95;
    }

    @media (min-width: 720px) {
      .wordmark { height: 18px; }
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      white-space: nowrap;
      padding: 0.35rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    header .status { display: none; }
    @media (min-width: 720px) {
      header .status { display: inline-flex; letter-spacing: 0.14em; font-size: 0.68rem; border: 0; padding: 0; }
    }

    .status i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8dffb0;
      box-shadow: 0 0 0 3px rgba(141, 255, 176, 0.12);
      animation: pulse 2.6s ease-in-out infinite;
      flex-shrink: 0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.25rem 1.25rem 1.75rem;
      gap: 1rem;
      max-width: 36rem;
      margin: 0 auto;
      width: 100%;
    }

    .mark {
      width: min(148px, 42vw);
      height: auto;
      display: block;
      margin-bottom: 0.15rem;
      filter: drop-shadow(0 12px 40px rgba(255,255,255,0.06));
      user-select: none;
    }

    .status-mobile {
      display: inline-flex;
      margin-bottom: 0.15rem;
    }

    @media (min-width: 720px) {
      .status-mobile { display: none; }
      .mark { width: min(200px, 48vw); margin-bottom: 0.35rem; }
      main { gap: 1.35rem; padding: 2rem 1.5rem 2.5rem; }
    }

    @media (min-width: 480px) and (max-width: 719px) {
      .mark { width: min(180px, 44vw); }
      main { gap: 1.2rem; padding: 1.75rem 1.5rem 2rem; }
    }

    .brand-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
    }

    .ykg {
      height: clamp(28px, 6vw, 36px);
      width: auto;
    }

    .digital {
      height: 11px;
      width: auto;
      opacity: 0.75;
      letter-spacing: 0.35em;
    }

    h1 {
      margin-top: 0.35rem;
      font-size: clamp(1.45rem, 4.2vw, 1.9rem);
      font-weight: 560;
      letter-spacing: -0.025em;
      line-height: 1.25;
    }

    .lead {
      color: var(--muted);
      font-size: clamp(0.92rem, 2.1vw, 1.05rem);
      line-height: 1.65;
      max-width: 28rem;
      padding: 0 0.25rem;
      text-wrap: balance;
    }

    .cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      justify-content: center;
      margin-top: 0.35rem;
    }

    .cta {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.85rem 1.25rem;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      color: var(--fg);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .cta-primary {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
      font-weight: 560;
    }

    .cta-primary:hover,
    .cta-primary:focus-visible {
      background: #fff;
      border-color: #fff;
      outline: none;
      transform: translateY(-1px);
    }

    .cta:hover,
    .cta:focus-visible {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.45);
      outline: none;
      transform: translateY(-1px);
    }

    .cta-primary:hover,
    .cta-primary:focus-visible {
      background: #fff;
    }

    .cta svg {
      width: 16px;
      height: 16px;
      opacity: 0.85;
    }

    .meta {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    footer {
      padding: 0 1.5rem 1.75rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }

    footer span { color: var(--soft); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status i { animation: none; }
      .cta { transition: none; }
      .cta:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>

            <path d="m4 7.5 8 6 8-6"/>
          </svg>
          Demo iste
        </a>
      </div>

      <p class="meta"><a href="/atlas-gizlilik.html" style="color:inherit">Atlas Gizlilik Politikası</a> · ykg.digital · 2016–2026</p>
    </main>

    <footer>
      © <span id="y">2026</span> YKG Digital · Tüm hakları saklıdır
    </footer>
  </div>

  <script>
    document.getElementById("y").textContent = String(new Date().getFullYear());
  </script>
</body>
</html>
