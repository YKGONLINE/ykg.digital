<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="YKG Digital — başka bir şey kuruyoruz. İletişim: ykg@ykg.digital" />
  <meta name="theme-color" content="#050505" />
  <meta property="og:title" content="YKG Digital" />
  <meta property="og:description" content="Sıradan bir yenileme değil. Başka bir şey kuruyoruz." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ykg.digital/" />
  <meta property="og:image" content="https://ykg.digital/assets/mark-deer.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>YKG Digital</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #050505;
      --fg: #f4f4f4;
      --muted: #8c8c8c;
      --soft: #c8c8c8;
      --line: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100%;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* tiny frame */
    body::after {
      content: "";
      position: fixed;
      inset: 5px;
      border: 1px solid var(--line);
      pointer-events: none;
      z-index: 5;
    }

    @media (min-width: 720px) {
      body::after { inset: 8px; }
    }

    .stage {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .grow {
      flex: 1 1 auto;
      min-height: 36vh;
    }

    @media (min-width: 720px) {
      .grow { min-height: 42vh; }
    }

    /* Huge deer — face dominates ~half the viewport */
    .beast {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -52%);
      width: min(145vw, 820px);
      height: auto;
      max-width: none;
      opacity: 0.92;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 30px 80px rgba(0, 0, 0, 0.55));
      z-index: 1;
    }

    @media (min-width: 720px) {
      .beast {
        width: min(100vw, 920px);
        top: 40%;
        transform: translate(-50%, -52%);
      }
    }

    /* soft fade so text stays readable over antlers/body */
    .veil {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(5,5,5,0.15) 0%, rgba(5,5,5,0.05) 35%, rgba(5,5,5,0.55) 62%, rgba(5,5,5,0.96) 82%, #050505 100%),
        radial-gradient(ellipse 70% 50% at 50% 28%, transparent 30%, rgba(5,5,5,0.35) 100%);
    }

    .top {
      position: relative;
      z-index: 3;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 0;
      display: flex;
      justify-content: center;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      white-space: nowrap;
      padding: 0.32rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(5, 5, 5, 0.35);
      backdrop-filter: blur(6px);
    }

    .status i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8dffb0;
      box-shadow: 0 0 0 3px rgba(141, 255, 176, 0.12);
      animation: pulse 2.6s ease-in-out infinite;
      flex-shrink: 0;
    }

    .panel {
      position: relative;
      z-index: 3;
      padding: 0 1.25rem calc(1rem + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.7rem;
      max-width: 34rem;
      margin: 0 auto;
      width: 100%;
    }

    .brand-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.15rem;
    }

    .ykg {
      height: clamp(26px, 5.5vw, 34px);
      width: auto;
    }

    .digital {
      height: 10px;
      width: auto;
      opacity: 0.72;
    }

    h1 {
      font-size: clamp(1.55rem, 5.2vw, 2.15rem);
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1.2;
      text-wrap: balance;
    }

    .lead {
      color: var(--muted);
      font-size: clamp(0.95rem, 2.4vw, 1.08rem);
      line-height: 1.65;
      max-width: 28rem;
      text-wrap: balance;
    }

    .lead strong {
      color: var(--soft);
      font-weight: 500;
    }

    .cta {
      margin-top: 0.35rem;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      color: var(--fg);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .cta:hover,
    .cta:focus-visible {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.4);
      outline: none;
    }

    .meta {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    footer {
      position: relative;
      z-index: 3;
      padding: 0 1rem 0.85rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.05em;
    }

    footer span { color: var(--soft); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status i { animation: none; }
      .cta { transition: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <img
      class="beast"
      src="assets/mark-deer.png"
      width="1295"
      height="1500"
      alt=""
      decoding="async"
      fetchpriority="high"
      aria-hidden="true"
    />
    <div class="veil" aria-hidden="true"></div>

    <div class="top">
      <p class="status"><i aria-hidden="true"></i> YAPIM AŞAMASINDA</p>
    </div>

    <div class="grow" aria-hidden="true"></div>

    <div class="panel">
      <div class="brand-row">
        <img class="ykg" src="assets/logo-white.png" alt="YKG" width="160" height="44" />
        <img class="digital" src="assets/logo-digital-white.png" alt="Digital" width="120" height="11" />
      </div>

      <h1>Sıradan bir yenileme değil.</h1>

      <p class="lead">
        2016’dan beri iletişim.
        Artık <strong>insan ile zekâyı aynı masaya oturtan</strong>
        ürünler ve sessiz sistemler kuruyoruz.
        Vitrin henüz yok — kapı açık.
      </p>

      <a class="cta" href="mailto:ykg@ykg.digital">ykg@ykg.digital</a>

      <p class="meta">ykg.digital · 2016–2026</p>

      <footer>
        © <span id="y">2026</span> YKG Digital
      </footer>
    </div>
  </div>

  <script>
    document.getElementById("y").textContent = String(new Date().getFullYear());
  </script>
</body>
</html>
