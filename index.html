<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="YKG Digital — insan ile zekâyı aynı masaya oturtuyoruz. ykg@ykg.digital" />
  <meta name="theme-color" content="#030303" />
  <meta property="og:title" content="YKG Digital" />
  <meta property="og:description" content="Sıradan bir yenileme değil." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ykg.digital/" />
  <meta property="og:image" content="https://ykg.digital/assets/mark-deer.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>YKG Digital</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #030303;
      --fg: #ececec;
      --muted: #7a7a7a;
      --dim: #4a4a4a;
      --line: rgba(255, 255, 255, 0.07);
      --line2: rgba(255, 255, 255, 0.12);
      --accent: #b8ffd4;
      --accent-dim: rgba(184, 255, 212, 0.14);
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100%;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* ambient field — sade ama derin */
    .field {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 60% at 50% 18%, rgba(184, 255, 212, 0.045), transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(255, 255, 255, 0.025), transparent 50%),
        var(--bg);
    }

    /* sparse tech grid */
    .grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        linear-gradient(to right, var(--line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 75% 70% at 50% 40%, #000 10%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 40%, #000 10%, transparent 75%);
    }

    /* fine scan — only if motion ok */
    .scan {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.04;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255, 255, 255, 0.35) 3px
      );
    }

    /* corner brackets — çerçeve değil, hedef noktası */
    .corners span {
      position: fixed;
      width: 18px;
      height: 18px;
      z-index: 6;
      pointer-events: none;
      border-color: var(--line2);
      border-style: solid;
      border-width: 0;
    }
    .corners .tl { top: 10px; left: 10px; border-top-width: 1px; border-left-width: 1px; }
    .corners .tr { top: 10px; right: 10px; border-top-width: 1px; border-right-width: 1px; }
    .corners .bl { bottom: 10px; left: 10px; border-bottom-width: 1px; border-left-width: 1px; }
    .corners .br { bottom: 10px; right: 10px; border-bottom-width: 1px; border-right-width: 1px; }

    @media (min-width: 720px) {
      .corners .tl { top: 16px; left: 16px; }
      .corners .tr { top: 16px; right: 16px; }
      .corners .bl { bottom: 16px; left: 16px; }
      .corners .br { bottom: 16px; right: 16px; }
    }

    .stage {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 22px 0;
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      color: var(--dim);
      text-transform: uppercase;
    }

    @media (min-width: 480px) {
      .hud-top { font-size: 0.62rem; letter-spacing: 0.14em; }
    }

    .hud-top .live {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .hud-top .live .long { display: none; }
    @media (min-width: 420px) {
      .hud-top .live .long { display: inline; }
    }

    .hud-top .live i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .grow {
      flex: 1 1 auto;
      min-height: 34vh;
      position: relative;
    }

    /* beast */
    .beast-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
    }

    .beast {
      width: min(150vw, 860px);
      height: auto;
      opacity: 0.88;
      user-select: none;
      transform: translateY(-4%);
      filter:
        drop-shadow(0 0 40px rgba(184, 255, 212, 0.08))
        drop-shadow(0 40px 90px rgba(0, 0, 0, 0.6));
      animation: breathe 7s ease-in-out infinite;
    }

    @media (min-width: 720px) {
      .beast {
        width: min(92vw, 900px);
        transform: translateY(-6%);
      }
      .grow { min-height: 40vh; }
    }

    .veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg,
          rgba(3,3,3,0.2) 0%,
          rgba(3,3,3,0.05) 30%,
          rgba(3,3,3,0.45) 58%,
          rgba(3,3,3,0.94) 80%,
          #030303 100%);
    }

    /* orbital ring behind face — single geometric accent */
    .orbit {
      position: absolute;
      left: 50%;
      top: 48%;
      width: min(72vw, 420px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(184, 255, 212, 0.08);
      border-radius: 50%;
      pointer-events: none;
      animation: spin 48s linear infinite;
    }

    .orbit::before {
      content: "";
      position: absolute;
      top: -3px;
      left: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(184, 255, 212, 0.55);
      transform: translateX(-50%);
      opacity: 0.7;
    }

    @media (min-width: 720px) {
      .orbit { width: min(48vw, 480px); top: 46%; }
    }

    .panel {
      position: relative;
      z-index: 3;
      padding: 0 1.3rem calc(1rem + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.75rem;
      max-width: 32rem;
      margin: 0 auto;
      width: 100%;
    }

    .tag {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      color: var(--accent);
      opacity: 0.75;
    }

    .brand-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .ykg {
      height: clamp(24px, 5vw, 32px);
      width: auto;
      opacity: 0.95;
    }

    .digital {
      height: 9px;
      width: auto;
      opacity: 0.55;
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2.05rem);
      font-weight: 520;
      letter-spacing: -0.03em;
      line-height: 1.18;
      text-wrap: balance;
    }

    .lead {
      color: var(--muted);
      font-size: clamp(0.92rem, 2.2vw, 1.05rem);
      line-height: 1.65;
      max-width: 26rem;
      text-wrap: balance;
    }

    .lead em {
      font-style: normal;
      color: var(--soft, #cfcfcf);
      color: #cfcfcf;
    }

    .cta {
      margin-top: 0.25rem;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.72rem 1.15rem;
      border: 1px solid var(--line2);
      border-radius: 999px;
      color: var(--fg);
      text-decoration: none;
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .cta:hover,
    .cta:focus-visible {
      border-color: rgba(184, 255, 212, 0.45);
      background: rgba(184, 255, 212, 0.05);
      color: var(--accent);
      outline: none;
    }

    .meta {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    footer {
      padding-top: 0.15rem;
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      color: var(--dim);
      text-transform: uppercase;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.84; filter: drop-shadow(0 0 36px rgba(184,255,212,0.06)) drop-shadow(0 40px 90px rgba(0,0,0,0.6)); }
      50% { opacity: 0.94; filter: drop-shadow(0 0 56px rgba(184,255,212,0.12)) drop-shadow(0 40px 90px rgba(0,0,0,0.6)); }
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .beast, .orbit, .hud-top .live i { animation: none; }
      .cta { transition: none; }
      .scan { display: none; }
    }
  </style>
</head>
<body>
  <div class="field" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>
  <div class="corners" aria-hidden="true">
    <span class="tl"></span>
    <span class="tr"></span>
    <span class="bl"></span>
    <span class="br"></span>
  </div>

  <div class="stage">
    <div class="hud-top">
      <span>YKG // NODE</span>
      <span class="live"><i aria-hidden="true"></i> LIVE<span class="long"> · DRAFT</span></span>
    </div>

    <div class="grow">
      <div class="beast-wrap">
        <div class="orbit" aria-hidden="true"></div>
        <img
          class="beast"
          src="assets/mark-deer.png"
          width="1295"
          height="1500"
          alt=""
          decoding="async"
          fetchpriority="high"
          aria-hidden="true"
        />
      </div>
      <div class="veil" aria-hidden="true"></div>
    </div>

    <div class="panel">
      <p class="tag">SYS.00 · REBUILD</p>

      <div class="brand-row">
        <img class="ykg" src="assets/logo-white.png" alt="YKG" width="160" height="44" />
        <img class="digital" src="assets/logo-digital-white.png" alt="Digital" width="120" height="11" />
      </div>

      <h1>Sıradan bir yenileme değil.</h1>

      <p class="lead">
        2016’dan beri iletişim.
        Artık <em>insan ile zekâyı aynı masaya oturtan</em>
        ürünler ve sessiz sistemler kuruyoruz.
        Vitrin henüz yok — kapı açık.
      </p>

      <a class="cta" href="mailto:ykg@ykg.digital">ykg@ykg.digital</a>

      <p class="meta">ykg.digital · 2016–2026</p>
      <footer>© <span id="y">2026</span> YKG Digital</footer>
    </div>
  </div>

  <script>
    document.getElementById("y").textContent = String(new Date().getFullYear());
  </script>
</body>
</html>
